{% extends "base.html" %}

{% block title %}Customer Login{% endblock %}

{% block content %}
<div class="auth-container">
    <h1 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h1>
    <p style="text-align: center; color: var(--secondary); margin-bottom: 2rem;">Sign in to place orders and manage your account.</p>
    
    <form action="{{ url_for('login') }}" method="POST">
        <!-- New Name Field for Registration -->
        <div class="form-group" id="name-group" style="display: none;">
            <label for="name">Full Name</label>
            <input type="text" name="name" id="name" class="form-control" placeholder="Enter your full name">
        </div>
        
        <div class="form-group">
            <label for="mobile_number">Mobile Number</label>
            <input type="tel" name="mobile_number" id="mobile_number" class="form-control" placeholder="10-digit mobile number" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
            <div>
                <input type="radio" id="action_login" name="action" value="login" checked>
                <label for="action_login" style="display: inline; font-weight: normal;">Login</label>
                
                <input type="radio" id="action_register" name="action" value="register" style="margin-left: 1rem;">
                <label for="action_register" style="display: inline; font-weight: normal;">Register</label>
            </div>
            <a href="{{ url_for('forgot_password') }}" style="font-size: 0.9rem;">Forgot Password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1rem;">Submit</button>
    </form>
</div>

<script>
    // JS to toggle the Name field visibility based on Login/Register selection
    const loginRadio = document.getElementById('action_login');
    const registerRadio = document.getElementById('action_register');
    const nameGroup = document.getElementById('name-group');
    const nameInput = document.getElementById('name');

    function toggleNameField() {
        if (registerRadio.checked) {
            nameGroup.style.display = 'block';
            nameInput.required = true;
        } else {
            nameGroup.style.display = 'none';
            nameInput.required = false;
        }
    }

    loginRadio.addEventListener('change', toggleNameField);
    registerRadio.addEventListener('change', toggleNameField);
    toggleNameField(); // Run on initial load
</script>
{% endblock %}

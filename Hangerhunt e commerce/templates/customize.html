{% extends "base.html" %}

{% block title %}Customize{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 800px;">
    <h1 style="text-align: center;">Customize Your T-Shirt</h1>
    <p style="text-align: center; color: var(--secondary); margin-bottom: 2rem;">Upload your designs for the front and back, and we'll bring them to life.</p>
    
    <form action="{{ url_for('customize') }}" method="POST" enctype="multipart/form-data">
        <div class="customize-grid">
            <div class="upload-area">
                <div class="file-input-wrapper">
                    <input type="file" name="front_image" id="front_image" accept="image/*" required>
                    <div class="btn-file">
                        <i class="fa-solid fa-cloud-arrow-up fa-2x mb-2"></i><br>
                        <span>Front Side (Choose Image)</span>
                    </div>
                </div>
            </div>
            
            <div class="upload-area">
                <div class="file-input-wrapper">
                    <input type="file" name="back_image" id="back_image" accept="image/*" required>
                    <div class="btn-file">
                        <i class="fa-solid fa-cloud-arrow-up fa-2x mb-2"></i><br>
                        <span>Back Side (Choose Image)</span>
                    </div>
                </div>
            </div>
        </div>

        <div style="margin-top: 2rem;">
            <div class="form-group">
                <label>Select Color</label>
                <div class="color-options" style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 0.5rem;">
                    {% for color in colors %}
                    <label style="cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 0.3rem;">
                        <input type="radio" name="color" value="{{ color.name }}" required style="display: none;" onchange="document.querySelectorAll('.color-circle').forEach(el=>el.style.border='2px solid transparent'); this.nextElementSibling.style.border='2px solid var(--primary)';">
                        <!-- Custom Swatch Graphic -->
                        <div class="color-circle" style="width: 35px; height: 35px; border-radius: 50%; background-color: {{ color.name|replace(' ', '') }}; border: 2px solid transparent; transition: 0.2s; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);"></div>
                        <span style="font-size: 0.8rem;">{{ color.name }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>

            <div class="form-group">
                <label for="size">Size</label>
                <select name="size" id="size" class="form-control" required>
                    <option value="" disabled selected>Choose your size</option>
                    <option value="S">Small (S)</option>
                    <option value="M">Medium (M)</option>
                    <option value="L">Large (L)</option>
                    <option value="XL">Extra Large (XL)</option>
                    <option value="XXL">Double Extra Large (XXL)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" name="quantity" id="quantity" class="form-control" min="1" value="1" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; font-size: 1.1rem; padding: 1rem;">Order</button>
    </form>
</div>
{% endblock %}

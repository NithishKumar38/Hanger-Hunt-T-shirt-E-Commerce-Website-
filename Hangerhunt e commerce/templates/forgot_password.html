{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-container">
    <h1 style="text-align: center; margin-bottom: 1rem;">Reset Password</h1>
    <p style="text-align: center; color: var(--secondary); margin-bottom: 2rem;">Enter your registered mobile number to reset your password.</p>
    
    <form action="{{ url_for('forgot_password') }}" method="POST">
        <div class="form-group">
            <label for="mobile_number">Registered Mobile Number</label>
            <input type="tel" name="mobile_number" id="mobile_number" class="form-control" placeholder="10-digit mobile number" required>
        </div>
        
        <div class="form-group">
            <label for="new_password">New Password</label>
            <input type="password" name="new_password" id="new_password" class="form-control" placeholder="Enter new password" required>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 1rem; margin-top: 1rem;">Update Password</button>
    </form>
    
    <div style="text-align: center; margin-top: 1.5rem;">
        <a href="{{ url_for('login') }}"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
    </div>
</div>
{% endblock %}
